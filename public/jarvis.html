<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#040914">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="J.A.R.V.I.S">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>J.A.R.V.I.S — Permanent Relay Gateway</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #040914;
      color: #00f0ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient HUD glow */
    body::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .reactor-box {
      position: relative;
      width: 140px;
      height: 140px;
      margin-bottom: 28px;
    }
    .ring {
      position: absolute;
      inset: 0;
      border: 2px solid rgba(0, 240, 255, 0.25);
      border-radius: 50%;
    }
    .ring.outer {
      border-top-color: #00f0ff;
      border-bottom-color: #00f0ff;
      animation: spin 3s linear infinite;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }
    .ring.inner {
      inset: 18px;
      border-left-color: #00f0ff;
      border-right-color: #00f0ff;
      animation: spin-rev 2s linear infinite;
    }
    .core {
      position: absolute;
      inset: 44px;
      background: radial-gradient(circle, #ffffff 0%, #00f0ff 60%, transparent 100%);
      border-radius: 50%;
      box-shadow: 0 0 25px #00f0ff;
      animation: pulse 1.6s ease-in-out infinite alternate;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-rev { 100% { transform: rotate(-360deg); } }
    @keyframes pulse {
      0% { transform: scale(0.92); opacity: 0.8; }
      100% { transform: scale(1.08); opacity: 1; }
    }

    h1 {
      font-size: 1.25rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 8px;
      color: #e0f7fa;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }
    .subtitle {
      font-size: 0.82rem;
      letter-spacing: 1.5px;
      color: rgba(0, 240, 255, 0.7);
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .status-card {
      background: rgba(4, 20, 36, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 12px;
      padding: 16px 20px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 240, 255, 0.05);
      backdrop-filter: blur(8px);
    }
    .status-text {
      font-size: 0.85rem;
      line-height: 1.5;
      color: #b2ebf2;
      margin-bottom: 12px;
    }
    .target-url {
      font-size: 0.72rem;
      word-break: break-all;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 12px;
      border-radius: 6px;
      color: rgba(0, 240, 255, 0.85);
      border: 1px dashed rgba(0, 240, 255, 0.3);
      margin-bottom: 16px;
      user-select: all;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 16px;
      background: #00f0ff;
      color: #040914;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.82rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      transition: all 0.2s ease;
      margin-top: 6px;
    }
    .btn:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }
    .btn.secondary {
      background: transparent;
      color: #00f0ff;
      border: 1px solid rgba(0, 240, 255, 0.4);
      box-shadow: none;
      margin-top: 10px;
    }
    .tip {
      margin-top: 24px;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.4);
      line-height: 1.4;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <div class="reactor-box">
    <div class="ring outer"></div>
    <div class="ring inner"></div>
    <div class="core"></div>
  </div>

  <h1>J.A.R.V.I.S Permanent Relay</h1>
  <div class="subtitle" id="relay-sub">Connecting to Workstation...</div>

  <div class="status-card">
    <div class="status-text" id="status-desc">Fetching active satellite tunnel from secure cloud memory...</div>
    <div class="target-url" id="target-display">Resolving tunnel...</div>
    <a href="#" id="direct-btn" class="btn" style="display:none;">Launch J.A.R.V.I.S Now</a>
    <button id="retry-btn" class="btn secondary" onclick="resolveAndConnect(true)" style="display:none;">🔄 Retry Workstation</button>
  </div>

  <div class="tip">
    💡 <strong>Permanent Bookmark:</strong> Save this exact URL to your phone's Home Screen. It will never expire or change.
  </div>

  <script>
    const GIST_RAW_URL = 'https://gist.githubusercontent.com/Aasim41/e7a1872adc3b4f26d9be72b738ef41a7/raw/jarvis_tunnel.txt';
    const CACHE_KEY = 'jarvis_last_live_url';

    async function resolveAndConnect(isManualRetry = false) {
      const sub = document.getElementById('relay-sub');
      const desc = document.getElementById('status-desc');
      const targetDisp = document.getElementById('target-display');
      const btn = document.getElementById('direct-btn');
      const retryBtn = document.getElementById('retry-btn');

      sub.innerText = 'Connecting to Workstation...';
      desc.innerText = 'Fetching live PC tunnel address...';
      targetDisp.innerText = 'Querying encrypted satellite relay...';
      btn.style.display = 'none';
      retryBtn.style.display = 'none';

      let liveUrl = null;

      try {
        // Fetch fresh URL bypassing browser cache
        const res = await fetch(`${GIST_RAW_URL}?nocache=${Date.now()}`, { cache: 'no-store' });
        if (res.ok) {
          const txt = (await res.text()).trim();
          if (txt && txt.startsWith('http') && !txt.includes('initiating') && !txt.includes('test-update')) {
            liveUrl = txt;
            localStorage.setItem(CACHE_KEY, liveUrl);
          }
        }
      } catch (e) {
        console.warn('Gist fetch error:', e);
      }

      // Fallback to cached URL if Gist temporarily unreachable
      if (!liveUrl) {
        liveUrl = localStorage.getItem(CACHE_KEY);
      }

      if (!liveUrl) {
        sub.innerText = '⚡ Workstation Offline';
        desc.innerText = 'Your workstation is currently in sleep mode or starting up. No active tunnel found.';
        targetDisp.innerText = 'Standby mode active.';
        retryBtn.style.display = 'block';
        return;
      }

      targetDisp.innerText = liveUrl;
      desc.innerText = 'Live tunnel located! Redirecting to J.A.R.V.I.S...';
      btn.href = liveUrl;
      btn.style.display = 'block';

      // Auto-redirect if not manually retrying
      if (!isManualRetry) {
        setTimeout(() => {
          window.location.replace(liveUrl);
        }, 400);
      }
    }

    // Auto-launch immediately
    resolveAndConnect();
  </script>
</body>
</html>
